global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "market-data-api"
    metrics_path: /metrics/
    static_configs:
      - targets:
          - "api:8000"

  - job_name: "market-data-consumer"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "consumer:9101"

  - job_name: "market-data-producer"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "producer:9102"

  - job_name: "kafka-exporter"
    static_configs:
      - targets:
          - "kafka-exporter:9308"