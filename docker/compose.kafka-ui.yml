services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: market-data-kafka-ui

    ports:
      - "${KAFKA_UI_HOST_PORT}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: market-data
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - market-data-network

    restart: unless-stopped

networks:
  market-data-network:
    name: market-data-network