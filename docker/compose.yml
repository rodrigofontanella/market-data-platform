services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka

    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        INTERNAL://:${KAFKA_INTERNAL_PORT},
        EXTERNAL://:${KAFKA_EXTERNAL_PORT},
        CONTROLLER://:${KAFKA_CONTROLLER_PORT}

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:${KAFKA_INTERNAL_PORT},
        EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka:${KAFKA_CONTROLLER_PORT}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:${KAFKA_INTERNAL_PORT} --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - market-data-network

    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python

    image: market-data-platform-python

    working_dir: /app

    command:
      [
        "alembic",
        "-c",
        "/app/alembic.ini",
        "upgrade",
        "head",
      ]

    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - market-data-network

    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python

    image: market-data-platform-python
    working_dir: /app/apps/api

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}

    ports:
      - "${API_HOST_PORT}:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - market-data-network

    restart: unless-stopped

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python

    image: market-data-platform-python
    working_dir: /app/apps/producer

    command: ["python", "-m", "app.main"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      PRODUCER_INTERVAL_SECONDS: ${PRODUCER_INTERVAL_SECONDS}

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - market-data-network

    restart: unless-stopped

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python

    image: market-data-platform-python
    working_dir: /app/apps/consumer

    command: ["python", "-m", "app.main"]

    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}
      DATABASE_URL: ${DOCKER_DATABASE_URL}

    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    networks:
      - market-data-network

    restart: unless-stopped

volumes:
  kafka_data:

networks:
  market-data-network:
    name: market-data-network