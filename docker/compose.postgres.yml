services:
  postgres:
    image: postgres:16
    container_name: market-data-postgres

    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: market_password

    ports:
      - "5433:5432"

    volumes:
      - market_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U market_user -d market_data",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - market-data-network

    restart: unless-stopped

volumes:
  market_postgres_data:

networks:
  market-data-network:
    name: market-data-network