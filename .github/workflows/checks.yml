# .github/workflows/checks.yml
#
# Runs ./scripts/check.sh --all on every push. The workflow holds no definition
# of "the checks" or of the environment: bootstrap.sh builds the venv,
# check.sh decides what runs. If this file grows a pytest command, that's a
# second definition and a mistake.
#
# e2e/ is deliberately not run here: it assumes a running compose stack.
# See docs/market-testing.md, Level 3.

name: checks

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04        # a fixed image, not ubuntu-latest
    timeout-minutes: 20          # the default is 6 hours; a hung container should not use them up

    steps:
      # Pinned to commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97      # v7.0.0
        with:
          python-version: "3.12"   # matches python:3.12-slim

      # Hand bootstrap the exact interpreter setup-python installed, rather than
      # whichever python3 is first on PATH. ubuntu-24.04 ships its own 3.12,
      # which would also pass the version check.
      - name: bootstrap
        run: ./scripts/bootstrap.sh
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      # Docker is preinstalled on GitHub-hosted Ubuntu runners, so the
      # testcontainers PostgreSQL and the promtool container both run as on Leeloo.
      - name: check
        run: ./scripts/check.sh --all